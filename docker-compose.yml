name: webtrees-dev

# Local dev stack: runs the PHP app and the Node migration-service
# together so the two are never accidentally out of sync (the "Soundex
# service is unavailable" error happens when the app is pointed at a
# migration-service URL but nothing is listening there).
#
# Both services bind-mount the whole repo — no code is baked into an
# image, so edits on the host take effect immediately, same as running
# `php -S` / `node server/migration-service.mjs` directly. vendor/ and
# node_modules/ must already exist on the host (composer install / npm
# install), same prerequisite as running natively.
#
# Usage:
#   docker compose up          # start everything, foreground
#   docker compose up -d       # start everything, background
#   docker compose down        # stop everything
#   docker compose down -v     # also wipe the postgres volume
# Then open http://localhost:8000 — data/webtrees.sqlite and
# data/config.ini.php (already present in this repo) are used as-is by
# the app service unless data/config.yaml exists (see setup-cli/).
#
# `postgres` is a local Postgres, used two ways: (1) as the target for
# setup-cli/ (the new Node setup tool, phase 5 of the php-to-js
# migration — see docs/php-to-js-migration/phase5-postgres-setup-cli.md),
# and (2) it's how golden/postgres-schema.sql / golden/postgres-seed.sql
# were originally generated (run the real PHP migration system once
# against a fresh instance of this service, then pg_dump the result —
# see that doc for the exact repeatable procedure). The app/migration
# services don't depend on it and work fine without it (they still use
# data/config.ini.php's sqlite setup by default) — it only matters once
# you run setup-cli/ to switch to a Postgres-backed install.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: webtrees
      POSTGRES_PASSWORD: webtrees
      POSTGRES_DB: webtrees
    ports:
      - "5432:5432"
    volumes:
      - webtrees-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webtrees"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    environment:
      WEBTREES_SOUNDEX_SERVICE_URL: http://migration:8090
      WEBTREES_SURNAME_TRADITION_SERVICE_URL: http://migration:8090
      WEBTREES_GEDCOM_SERVICE_URL: http://migration:8090
      WEBTREES_FACT_SORT_SERVICE_URL: http://migration:8090
      WEBTREES_GEDCOM_EXPORT_SERVICE_URL: http://migration:8090
      WEBTREES_GEDCOM_IMPORT_SERVICE_URL: http://migration:8090
    depends_on:
      migration:
        condition: service_healthy

  migration:
    image: node:22-alpine
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8090:8090"
    environment:
      PORT: "8090"
    command: ["node", "server/migration-service.mjs"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8090/health"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s

volumes:
  webtrees-postgres-data:
